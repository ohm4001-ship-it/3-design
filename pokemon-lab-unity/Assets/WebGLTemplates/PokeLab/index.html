<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#dce8d4">
  <title>POKÉ LAB · 바람결 섬</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#c0dcd0;color:#28443c;font-family:"Malgun Gothic",sans-serif}#unity-canvas{width:100%;height:100%;display:block;outline:none;background:#b9dcd4}#loading{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 60%,#f4f3df 0%,#deead5 45%,#bfdcd0 100%);transition:opacity .5s}#loading.hide{opacity:0;pointer-events:none}.card{text-align:center;width:min(440px,85vw)}.eyebrow{font-size:11px;letter-spacing:.3em;color:#718779;margin:30px 0 20px}h1{font-size:43px;letter-spacing:-.035em;margin:0 0 14px;font-weight:800}p{font-size:15px;line-height:1.8;color:#748174}.orb{width:88px;height:88px;margin:auto;border-radius:50%;background:linear-gradient(#e4b86e 0 47%,#476353 47% 53%,#fff8e5 53%);box-shadow:0 22px 0 -15px #748e6830;animation:float 2.8s ease-in-out infinite;position:relative}.orb:after{content:"";position:absolute;left:33px;top:33px;width:22px;height:22px;border-radius:50%;background:#fff9e8;border:6px solid #476353}.bar{height:5px;background:#c2d2bb;border-radius:10px;overflow:hidden;margin:30px auto 12px;width:260px}.fill{height:100%;width:0;background:#466d52;transition:width .15s}#status{font-size:12px;font-variant-numeric:tabular-nums;color:#758572}.hint{position:fixed;bottom:32px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.05em;color:#7f8c7d}#error{display:none;white-space:pre-wrap;line-height:1.7;font-size:14px;background:#fff6e7;padding:18px;border-radius:12px;margin-top:20px}button{border:0;border-radius:9px;background:#355e4b;color:white;padding:12px 25px;cursor:pointer;font:inherit}@keyframes float{50%{transform:translateY(-12px);box-shadow:0 34px 0 -17px #748e681c}}@media(prefers-reduced-motion:reduce){.orb{animation:none}.fill,#loading{transition:none}}
  </style>
</head>
<body>
  <canvas id="unity-canvas" width="1600" height="900" tabindex="0" aria-label="포켓몬 제작·탐험 게임"></canvas>
  <div id="loading"><div class="card"><div class="orb"></div><div class="eyebrow">A LITTLE FRIEND. A BIG ADVENTURE.</div><h1>POKÉ LAB</h1><p>나만의 친구와 함께 떠나는<br>바람결 섬의 작은 모험</p><div class="bar"><div class="fill" id="progress"></div></div><div id="status">모험을 준비하고 있어요 · 0%</div><div id="error"></div></div><div class="hint">WASD 이동 · E 만나기 · 키보드와 마우스로 함께 떠나보세요</div></div>
  <script>
    const canvas=document.querySelector('#unity-canvas');
    const config={dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'PokeLab',productName:'PokeLab Wilds',productVersion:'1.0.0',matchWebGLToCanvasSize:true};
    function showError(message){const error=document.querySelector('#error');error.style.display='block';error.textContent='모험을 불러오지 못했어요. 브라우저에서 WebGL을 사용할 수 있는지 확인해주세요.\n'+String(message);const button=document.createElement('button');button.textContent='다시 시도';button.onclick=()=>location.reload();error.append(document.createElement('br'),button);document.querySelector('#status').textContent='연결을 확인해주세요';}
    const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';script.onload=()=>createUnityInstance(canvas,config,progress=>{document.querySelector('#progress').style.width=(progress*100)+'%';document.querySelector('#status').textContent='모험을 준비하고 있어요 · '+Math.round(progress*100)+'%';}).then(instance=>{window.pokeLabInstance=instance;document.querySelector('#loading').classList.add('hide');setTimeout(()=>document.querySelector('#loading').remove(),600);canvas.focus();}).catch(showError);script.onerror=()=>showError('게임 파일을 불러올 수 없습니다.');document.body.appendChild(script);canvas.addEventListener('pointerdown',()=>canvas.focus());
  </script>
</body>
</html>
